version: "2"

linters:
  default: standard
  enable:
    - revive
    - testifylint
  settings:
    revive:
      enable-default-rules: false
      rules:
        - name: context-as-argument
        - name: error-return
        - name: errorf

formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
