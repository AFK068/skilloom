name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.service }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        service: [collector, ingest]
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - run: go -C "${{ matrix.service }}" build ./...
      - if: runner.os == 'Linux'
        run: make test lint SERVICE="${{ matrix.service }}"
