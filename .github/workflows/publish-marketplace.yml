name: Publish marketplace

on:
  push:
    branches: [main]
    paths: ['collector/**', 'Makefile']

concurrency: publish-marketplace

jobs:
  publish:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: collector/go.mod
          cache-dependency-path: collector/go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
      - run: make marketplace
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: marketplace
          folder: dist/marketplace
          commit-message: publish marketplace
          force: false
